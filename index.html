<style>
:root{
  --bg:#0b1218; --bg2:#101a23; --card:#14202b; --line:#22313e; --ink:#e9eef3; --muted:#9db0c0;
  --acc:#2fbf9b; --acc2:#e9c46a; --accInk:#06231b; --shadow:0 10px 40px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#f6f4ef; --bg2:#ffffff; --card:#ffffff; --line:#e3ded2; --ink:#16212b; --muted:#566574;
  --acc:#0f7b5f; --acc2:#b9831c; --accInk:#ffffff; --shadow:0 10px 30px rgba(30,40,50,.10);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;line-height:1.15;letter-spacing:-.01em}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:84px 0}
.eyebrow{color:var(--acc);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
h2{font-size:clamp(28px,4vw,40px);margin:8px 0 14px}
.lead{color:var(--muted);max-width:680px}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:20px;text-decoration:none}
.logo span{color:var(--acc)}
nav ul{display:flex;gap:22px;list-style:none;padding:0}
nav a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
nav a:hover{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.btn-i{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
.btn-i:hover{border-color:var(--acc)}
.burger{display:none}
@media(max-width:860px){
  nav{position:absolute;top:64px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--line);display:none}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:0;padding:8px 20px 16px}
  nav a{display:block;padding:11px 0}
  .burger{display:inline-block}
}

/* hero */
.hero{padding:140px 0 70px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:640px;height:640px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,transparent),transparent 65%);pointer-events:none}
.hero h1{font-size:clamp(36px,6.2vw,66px);max-width:860px;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{font-size:19px;color:var(--muted);max-width:640px}
.hero .wrap{position:relative}
.hero-photo{position:absolute;top:0;right:20px;width:210px;height:210px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--acc);box-shadow:var(--shadow);background:var(--card)}
@media(max-width:860px){.hero-photo{position:static;float:right;width:96px;height:96px;margin:0 0 8px 14px}}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 8px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:12px;border:1px solid var(--acc);cursor:pointer;font-size:15px}
.btn.p{background:var(--acc);color:var(--accInk)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{background:transparent;color:var(--ink)}
.btn.s:hover{background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:54px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat b{display:block;font:700 38px/1 Georgia,serif;color:var(--acc2)}
.stat span{color:var(--muted);font-size:14px}
.partners{margin-top:30px;color:var(--muted);font-size:13px;letter-spacing:.06em}
.partners strong{color:var(--ink);margin-right:6px}

/* grids */
.grid{display:grid;gap:16px;margin-top:34px}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:var(--shadow)}
.card .ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 16%,transparent);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.card h3{font-size:19px;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px}
.about{display:grid;grid-template-columns:1fr 1.5fr;gap:44px;align-items:start}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.avatar{aspect-ratio:1;max-width:320px;border-radius:24px;background:linear-gradient(135deg,#0f5c4d,#173a4f);display:grid;place-items:center;font:700 96px Georgia,serif;color:var(--acc2);border:1px solid var(--line);box-shadow:var(--shadow)}
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.about p{color:var(--muted);margin-bottom:14px}
.about p strong{color:var(--ink)}

/* timeline */
.tl{position:relative;margin-top:34px;padding-left:26px;border-left:2px solid var(--line)}
.ti{position:relative;margin-bottom:26px}
.ti:before{content:"";position:absolute;left:-34px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--acc)}
.ti .d{color:var(--acc2);font-size:13px;font-weight:700;letter-spacing:.04em}
.ti h3{font-size:18px;margin:2px 0}
.ti .o{color:var(--muted);font-size:14px}
.ti p{margin-top:6px;color:var(--muted);font-size:15px}

/* chips */
.sk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.sk h3{font-size:16px;margin-bottom:12px;color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600}

/* lab */
.lab{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:34px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.panel{display:none}.panel.on{display:block}
.ctrl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=range]{accent-color:var(--acc)}
select,input[type=text],input[type=email],textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
svg text{fill:var(--muted);font:12px system-ui,sans-serif}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.big{font:700 34px Georgia,serif;color:var(--acc2)}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:36px}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
.cl a{display:block;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.cl a small{display:block;color:var(--muted)}
.cl a:hover{color:var(--acc)}
form{display:grid;gap:12px}
textarea{min-height:130px;resize:vertical}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:13px;text-align:center}

.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>

let lang="fr", theme="dark";
try{lang=localStorage.getItem("lang")||"fr";theme=localStorage.getItem("theme")||theme}catch(e){}
const $=s=>document.querySelector(s);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  $("#lang").textContent=lang==="fr"?"EN":"FR";
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=t[e.dataset.i18n]??""});
  $("#navlist").innerHTML=t.nav.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("");
  $("#cvlink").href=t.cv;
  $("#stats").innerHTML=t.stats.map(s=>`<div class="stat"><b data-n="${s[0]}" data-s="${s[1]}">0${s[1]}</b><span>${s[2]}</span></div>`).join("");
  $("#about_p").innerHTML=t.about.map(p=>`<p>${p}</p>`).join("");
  $("#exp").innerHTML=t.exp.map(c=>`<div class="card rv"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join("");
  $("#tl").innerHTML=t.tl.map(i=>`<div class="ti"><div class="d">${i[0]}</div><h3>${i[1]}</h3><div class="o">${i[2]}</div><p>${i[3]}</p></div>`).join("");
  $("#pro").innerHTML=t.pro.map(c=>`<div class="card rv"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("");
  $("#ski").innerHTML=t.ski.map(g=>`<div class="sk rv"><h3>${g[0]}</h3><div class="chips">${g[1].map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>`).join("");
  $("#edu_g").innerHTML=t.edu.map(e=>`<div class="card rv"><h3>${e[0]}</h3><p>${e[1]}</p></div>`).join("");
  $("#fn").placeholder=t.fn;$("#fe").placeholder=t.fe;$("#fm").placeholder=t.fm;
  const sel=$("#ind");const cur=sel.selectedIndex>0?sel.selectedIndex:0;
  sel.innerHTML=t.inds.map((x,i)=>`<option value="${i}">${x}</option>`).join("");sel.selectedIndex=cur;
  drawBars();drawLine();observe();
}

/* demo charts (simulated data) */
const REG=[[78,62,55],[64,71,48],[52,58,40],[71,66,61],[59,49,37],[83,74,68],[47,55,33],[68,60,52]];
function drawBars(){
  const t=T[lang],i=+$("#ind").value,svg=$("#bars"),W=640,H=280,m={l:34,b:40,t:14},bw=(W-m.l-10)/REG.length;
  let s=`<line x1="${m.l}" y1="${H-m.b}" x2="${W-6}" y2="${H-m.b}" stroke="${cssv('--line')}"/>`;
  [0,25,50,75,100].forEach(v=>{const y=H-m.b-(H-m.b-m.t)*v/100;s+=`<line x1="${m.l}" x2="${W-6}" y1="${y}" y2="${y}" stroke="${cssv('--line')}" stroke-dasharray="3 4"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${v}</text>`});
  REG.forEach((r,k)=>{const v=r[i],h=(H-m.b-m.t)*v/100,x=m.l+k*bw+bw*.18,y=H-m.b-h;
    s+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${h}" rx="5" fill="${cssv('--acc')}"><title>${t.reg} ${String.fromCharCode(65+k)} : ${v}%</title></rect><text x="${x+bw*.32}" y="${y-6}" text-anchor="middle" style="fill:${cssv('--ink')}">${v}</text><text x="${x+bw*.32}" y="${H-m.b+18}" text-anchor="middle">${t.reg} ${String.fromCharCode(65+k)}</text>`});
  svg.innerHTML=s;
}
function popAt(y){return 5.0*Math.pow(1+0.0265-(y-2023)*0.00035,(y-2023))}
function drawLine(){
  const t=T[lang],svg=$("#line"),W=640,H=280,m={l:44,r:14,b:36,t:16},y0=2023,y1=2053,yr=+$("#yr").value;
  const maxV=popAt(y1)*1.05,X=y=>m.l+(W-m.l-m.r)*(y-y0)/(y1-y0),Y=v=>H-m.b-(H-m.b-m.t)*v/maxV;
  let pts=[];for(let y=y0;y<=y1;y++)pts.push(`${X(y)},${Y(popAt(y))}`);
  let s="";
  [0,.25,.5,.75,1].forEach(f=>{const v=maxV*f,y=Y(v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="${cssv('--line')}" stroke-dasharray="3 4"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${v.toFixed(1)}</text>`});
  [2023,2033,2043,2053].forEach(y=>{s+=`<text x="${X(y)}" y="${H-m.b+18}" text-anchor="middle">${y}</text>`});
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${cssv('--acc')}" stroke-width="3" stroke-linejoin="round"/>`;
  s+=`<line x1="${X(yr)}" x2="${X(yr)}" y1="${m.t}" y2="${H-m.b}" stroke="${cssv('--acc2')}" stroke-dasharray="4 4"/><circle cx="${X(yr)}" cy="${Y(popAt(yr))}" r="6" fill="${cssv('--acc2')}"/>`;
  s+=`<text x="${m.l}" y="12">${t.popt}</text>`;
  svg.innerHTML=s;$("#yrv").textContent=`${yr} · ${popAt(yr).toFixed(2)} M`;
}

/* interactions */
$("#ind").onchange=drawBars;$("#yr").oninput=drawLine;
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button,.panel").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");$("#"+b.dataset.p).classList.add("on");drawBars();drawLine();
});
$("#lang").onclick=()=>{lang=lang==="fr"?"en":"fr";try{localStorage.setItem("lang",lang)}catch(e){}render()};
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;try{localStorage.setItem("theme",theme)}catch(e){}drawBars();drawLine()};
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$("#navlist").onclick=e=>{if(e.target.tagName==="A")$("#nav").classList.remove("open")};
$("#f").onsubmit=e=>{e.preventDefault();
  const b=`${$("#fm").value}\n\n${$("#fn").value} (${$("#fe").value})`;
  location.href=`mailto:abdjah1900@gmail.com?subject=${encodeURIComponent(T[lang].subj)}&body=${encodeURIComponent(b)}`;
};

/* reveal + counters */
let io;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{
    if(!en.isIntersecting)return;
    en.target.classList.add("in");
    const c=en.target.querySelector&&en.target.querySelector("[data-n]");
    if(en.target.matches(".stat")){const b=en.target.querySelector("b");count(b)}
    io.unobserve(en.target);
  }),{threshold:.15});
  document.querySelectorAll(".rv,.stat,.ti").forEach(e=>io.observe(e));
}
function count(b){
  const n=+b.dataset.n,sfx=b.dataset.s;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){b.textContent=n+sfx;return}
  const t0=performance.now(),d=1200;
  (function f(t){const p=Math.min((t-t0)/d,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)))+sfx;if(p<1)requestAnimationFrame(f)})(t0);
}
document.documentElement.dataset.theme=theme;
render();
</script>
